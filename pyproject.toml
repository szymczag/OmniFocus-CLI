[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnifocus-cli"
version = "0.1.0"
description = "Independent CLI and MCP server for OmniFocus 4, running in Podman"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "click>=8.1,<9.0",
    "rich>=13.0,<14.0",
    "httpx>=0.27,<1.0",
    "cryptography>=42.0,<44.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.4,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
of = "omnifocus.cli:cli"
of-mcp = "omnifocus.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifocus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/omnifocus --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["src/omnifocus"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101"]  # assert in tests is fine

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/omnifocus"]
