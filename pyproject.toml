[build-system]
requires = ["hatchling>=1.29.0,<2.0"]
build-backend = "hatchling.build"

[project]
name = "omnifocus-cli"
version = "1.4.1"
description = "Independent CLI and MCP server for OmniFocus 4, running in Podman"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["omnifocus", "cli", "mcp", "podman", "webdav", "productivity"]
authors = [{ name = "Maciej Szymczak", email = "maciej@szymczak.at" }]
maintainers = [{ name = "Maciej Szymczak", email = "maciej@szymczak.at" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.3.1,<9.0",
    "rich>=14.3.3,<16.0",
    "httpx>=0.28.1,<0.29",
    "cryptography>=48.0.1,<50.0",
    "mcp>=1.26.0,<2.0",
    "fastapi>=0.138.0,<0.142",
    "pydantic>=2.12.0,<3.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.37.0,<0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "respx>=0.22.0,<0.24",
    "ruff>=0.15.7,<0.16",
    "black>=26.3.1,<27.0",
    "mypy>=1.19.1,<3.0",
    "pip-audit>=2.10.0,<3.0",
]

[project.scripts]
of = "omnifocus.cli:cli"
of-mcp = "omnifocus.mcp_server:main"
of-http = "omnifocus.http_api:main"

[project.urls]
Homepage = "https://github.com/szymczag/OmniFocus-CLI"
Repository = "https://github.com/szymczag/OmniFocus-CLI"
Issues = "https://github.com/szymczag/OmniFocus-CLI/issues"
Changelog = "https://github.com/szymczag/OmniFocus-CLI/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifocus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/omnifocus --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["src/omnifocus"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101"]  # assert in tests is fine

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src/omnifocus"]
