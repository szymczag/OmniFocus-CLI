name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  container-image:
    name: Publish Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Enable arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up multi-arch builder
        run: |
          docker buildx create --name omnifocus-release-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch runtime image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/omnifocus-cli"
          version="${GITHUB_REF_NAME}"
          docker buildx build \
            --file Containerfile \
            --target runtime \
            --platform linux/amd64,linux/arm64 \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            --push \
            .

  github-release:
    name: Create GitHub Release
    needs: container-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build backend
        run: pip install build

      - name: Build release artifacts
        run: python -m build

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*
